name: Calibrar simulação

# Execução manual ou quando o script de calibragem muda no branch de desenvolvimento.
on:
  workflow_dispatch:
  push:
    branches: [claude/botafogo-brasileirao-dashboard-np9i2h]
    paths:
      - scripts/calibrar.py
      - .github/workflows/calibrar.yml

jobs:
  calibrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar calibragem
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/calibrar.py
