name: Diagnóstico das APIs

# Roda a cada push que altere o script ou este arquivo, e também manualmente.
on:
  push:
    branches: [claude/botafogo-brasileirao-dashboard-np9i2h]
    paths:
      - scripts/diagnostico_apis.py
      - .github/workflows/diagnostico.yml
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar diagnóstico
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/diagnostico_apis.py --saida diagnostico.json

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico.json
          if-no-files-found: ignore
